[build-system]
requires = ["setuptools>=62.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-musubi"
description = "Parser for Musubi, a small functional programming language"
version = "0.1.0"
keywords = ["incremental", "parsing", "tree-sitter", "musubi"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "Linus Schneeberg", email = "linus.schneeberg@schlafhase.uk" }]
requires-python = ">=3.10"
license.text = "GPL"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/schlafhase/musubi"

[project.optional-dependencies]
core = ["tree-sitter~=0.24"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
