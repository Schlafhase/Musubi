[package]
name = "tree-sitter-musubi"
description = "Parser for Musubi, a small functional programming language"
version = "0.1.0"
authors = ["Linus Schneeberg <linus.schneeberg@schlafhase.uk>"]
license = "GPL"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "musubi"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/schlafhase/musubi"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25.10"
